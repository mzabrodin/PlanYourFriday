name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PlanYourFriday.slnx

      - name: Check formatting
        run: dotnet format PlanYourFriday.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PlanYourFriday.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test PlanYourFriday.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Restore tools
        run: dotnet tool restore

      - name: Check migrations are up to date
        env:
          # The design-time host needs the Development connection string; no database is contacted
          ASPNETCORE_ENVIRONMENT: Development
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/PlanYourFriday.Infrastructure
          --startup-project src/PlanYourFriday.Api
          --configuration Release
          --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
