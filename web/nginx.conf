# Serves the built SPA and proxies /api to the API container, so both share one origin
# (the session cookie is SameSite=Lax and the SPA calls the relative /api).

# Docker Desktop's port link opens 127.0.0.1; Google accepts only the registered localhost
# redirect URIs and the session cookie is per host, so send it to localhost
map $http_host $localhost_url {
    ~^127\.0\.0\.1(?<port>:\d+)?$  http://localhost$port;
    default                        "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 302, not 301: browsers cache a 301 forever
    if ($localhost_url) {
        return 302 $localhost_url$request_uri;
    }

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Docker's DNS, re-resolved on each request: rebuilding the api container gives it a new IP,
        # and nginx must not keep the old one or refuse to start while api is still down
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        proxy_pass $api;

        # Keep the browser's host (localhost:8080) so the API builds the right Google redirect_uri
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite puts a content hash in every file name here, so they never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes such as /groups/42 fall back to the SPA; index.html itself is never cached
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
